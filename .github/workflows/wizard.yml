name: Wizard contribution animation

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/wizard.py'
      - '.github/workflows/wizard.yml'

permissions:
  contents: write

concurrency:
  group: wizard-animation
  cancel-in-progress: false

jobs:
  animate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Generate animation
        run: python scripts/wizard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
      - name: Publish image to output branch
        run: |
          cp dist/wizard.gif "$RUNNER_TEMP/wizard.gif"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin output:output || true
          if git show-ref --verify --quiet refs/heads/output; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf . || true
          fi
          cp "$RUNNER_TEMP/wizard.gif" wizard.gif
          git add wizard.gif
          if ! git diff --cached --quiet; then
            git commit -m 'Update wizard animation'
            git push origin output
          fi
